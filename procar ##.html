<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PROCAR — 3D Highway</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#74c9f5;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;background:#05070a;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;color:#fff;pointer-events:none}
.stat{position:absolute;left:18px;top:18px;min-width:175px;padding:9px 14px;background:rgba(5,15,28,.82);border-radius:12px;font-weight:800;line-height:1.35}
.stat div{margin:2px 0}.num{color:#ffd329;font-size:21px}
.pause{position:absolute;left:18px;top:150px;width:54px;height:54px;border:0;border-radius:12px;background:#081321dd;color:white;font-size:25px;pointer-events:auto}
.gauge{position:absolute;right:18px;top:14px;width:145px;height:145px;border-radius:50%;border:9px solid #39c9ed;background:#07121fe8;box-shadow:inset 0 0 0 7px #162d43;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:34px}
.gauge small{display:block;font-size:11px;letter-spacing:1px}
.bar{position:absolute;right:20px;width:185px;height:42px;background:#07121ddd;border-radius:11px;padding:8px;font-size:15px;font-weight:800}
#fuel{top:170px}#health{top:220px}
.fill{display:inline-block;height:14px;border-radius:7px;width:110px;vertical-align:middle;margin-left:7px;background:#21d94b}
.red{background:#f22}
.controls{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 28px}
.grp{display:flex;gap:20px}
.btn{touch-action:none;-webkit-user-select:none;user-select:none;width:88px;height:88px;border-radius:50%;border:2px solid #fff9;background:#111b;color:#fff;font-size:44px;font-weight:800;pointer-events:auto}
.action{width:102px;height:88px;border-radius:18px;font-size:16px}
#over{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#0009;color:#fff;text-align:center;z-index:5}
.card{background:#101a25;padding:28px 38px;border-radius:20px;border:1px solid #ffffff33}
.card button{border:0;border-radius:11px;background:#168cff;color:#fff;padding:13px 26px;font-size:17px;font-weight:800}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#09131feF;color:white;z-index:10}
#startScreen{position:fixed;inset:0;z-index:14;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#153d63 0,#07111d 48%,#02060b 100%);color:#fff;text-align:center;padding:20px}
.startCard{width:min(560px,92vw);padding:34px 24px;border:1px solid #ffffff22;border-radius:26px;background:#071321eF;box-shadow:0 20px 80px #000b}
.startLogo{font-size:56px;font-weight:1000;letter-spacing:4px;color:#31c9ff;text-shadow:0 0 25px #159fff88;margin-bottom:6px}.startSub{color:#b8c8d8;font-size:15px;margin-bottom:24px}.playBtn{width:100%;border:0;border-radius:15px;padding:16px;background:linear-gradient(90deg,#168cff,#20c8ff);color:#fff;font-size:20px;font-weight:1000;cursor:pointer}.countdown{position:fixed;inset:0;z-index:13;display:none;align-items:center;justify-content:center;background:#0007;color:#fff;pointer-events:none}.countNum{font-size:min(24vw,190px);font-weight:1000;text-shadow:0 8px 35px #000;animation:countPop .8s ease both}@keyframes countPop{0%{transform:scale(1.8);opacity:0}25%{opacity:1}100%{transform:scale(1);opacity:1}}
#carSelect{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#06101eeF,#081a2eeF);color:#fff;padding:18px}
.selectCard{width:min(760px,94vw);max-height:92vh;overflow:auto;background:#0b1624f5;border:1px solid #ffffff22;border-radius:24px;padding:22px;box-shadow:0 18px 60px #0008;text-align:center}
.selectCard h1{margin:0 0 6px;font-size:30px}.selectCard p{margin:0 0 18px;color:#b9c8d8}
.carGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.carChoice{border:2px solid #ffffff22;background:#101f30;border-radius:16px;color:#fff;padding:10px 6px;cursor:pointer;touch-action:manipulation}.carChoice.active{border-color:#36c8ff;box-shadow:0 0 0 3px #36c8ff22}.carPreview{height:74px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;font-size:42px}.carName{font-weight:900;font-size:13px}.startGame{margin-top:18px;width:100%;border:0;border-radius:14px;padding:14px;background:#168cff;color:#fff;font-size:18px;font-weight:900;cursor:pointer}
@media(max-width:700px){.mission{right:8px;top:205px;min-width:145px;font-size:11px}.mission{line-height:1.35}}@media(max-width:700px){.selectCard{padding:16px}.selectCard h1{font-size:24px}.carGrid{grid-template-columns:repeat(3,1fr)}.carPreview{height:62px;font-size:34px}}
@media (orientation:portrait){#game:after{content:"Rotate your phone to landscape";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#07111dcc;color:white;font-weight:800;font-size:18px;z-index:20}}
@media(max-width:700px){.stat{left:8px;top:8px;min-width:145px;font-size:12px}.num{font-size:17px}.pause{left:8px;top:120px}.gauge{right:8px;top:8px;width:105px;height:105px;font-size:24px}.bar{right:8px;width:145px;height:35px;font-size:11px}.fill{width:75px;height:11px}.btn{width:68px;height:68px;font-size:35px}.action{width:76px;height:68px;font-size:12px}.controls{padding:0 12px;gap:8px}.grp{gap:10px}}
#countdown{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;pointer-events:none;text-align:center;font-size:clamp(90px,18vw,220px);font-weight:1000;color:white;text-shadow:0 6px 25px #000,0 0 30px #18a9ff}.mission{position:absolute;right:18px;top:275px;min-width:185px;padding:10px 14px;border-radius:12px;background:#07121ddd;color:#fff;font-weight:800;line-height:1.45}.mission b{color:#ffd329}</style>
</head>
<body>
<div id="game"></div>
<div id="loading">Loading PROCAR 3D…</div>
<div id="soundHint" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;background:#07111ddd;color:white;padding:14px 20px;border-radius:12px;font-weight:700;display:none;pointer-events:none">Tap GAS to enable sound 🔊</div>
<div id="startScreen">
  <div class="startCard">
    <div class="startLogo">PROCAR</div>
    <div class="startSub">3D HIGHWAY RACING</div>
    <button id="playNow" class="playBtn">START GAME ▶</button>
  </div>
</div>
<div id="countdown"><div id="countNum" class="countNum">3</div></div>

<div id="carSelect" style="display:none">
  <div class="selectCard">
    <h1>🚗 SELECT YOUR CAR</h1>
    <p>Choose your car and start the race</p>
    <div class="carGrid">
      <button class="carChoice active" data-color="086dff"><div class="carPreview" style="background:#086dff22">🔵</div><div class="carName">BLUE</div></button>
      <button class="carChoice" data-color="e52f38"><div class="carPreview" style="background:#e52f3822">🔴</div><div class="carName">RED</div></button>
      <button class="carChoice" data-color="18b86a"><div class="carPreview" style="background:#18b86a22">🟢</div><div class="carName">GREEN</div></button>
      <button class="carChoice" data-color="252a32"><div class="carPreview" style="background:#252a3222">⚫</div><div class="carName">BLACK</div></button>
      <button class="carChoice" data-color="f0a51a"><div class="carPreview" style="background:#f0a51a22">🟡</div><div class="carName">GOLD</div></button>
    </div>
    <button id="startGame" class="startGame">START RACE ▶</button>
  </div>
</div>

<div id="hud">
  <div class="stat">
    🏆 SCORE <span id="score" class="num">1250</span><br>
     🥇 BEST <span id="bestScore" class="num">0</span><br>
    📏 DISTANCE <span id="distance" class="num">2.8 KM</span><br>
    🪙 COINS <span id="coins" class="num">48</span>
  </div>
  <button class="pause" id="pause">Ⅱ</button>
  <button id="music" style="position:absolute;left:82px;top:150px;width:54px;height:54px;border:0;border-radius:12px;background:#081321dd;color:white;font-size:23px;pointer-events:auto">🎵</button>

  <div class="mission">🎯 COIN MISSIONS<br>🪙 <b>10</b> — <span id="m10">0/10</span><br>🪙 <b>25</b> — <span id="m25">0/25</span><br>🪙 <b>50</b> — <span id="m50">0/50</span></div>
  <div class="gauge"><div><span id="speed">180</span><small>KM/H</small></div></div>
  <div class="bar" id="fuel">⛽ <span class="fill" id="fuelFill"></span></div>
  <div class="bar" id="health">❤️ <span class="fill red" id="healthFill"></span></div>

  <div class="controls">
    <div class="grp"><button class="btn" id="left">‹</button><button class="btn" id="right">›</button></div>
    <div class="grp"><button class="btn action" id="brake">BRAKE</button><button class="btn action" id="gas">GAS</button></div>
  </div>
</div>

<div id="over"><div class="card"><h1>GAME OVER</h1><p id="final"></p><button id="restart">RESTART</button></div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const root=document.getElementById("game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x6fc6f4);
scene.fog=new THREE.Fog(0x6fc6f4,80,300);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,500);
camera.position.set(0,5.35,13.8);
camera.lookAt(0,1.05,-30);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc9edff,0x49633b,2.0));
const sun=new THREE.DirectionalLight(0xffffff,2.6);
sun.position.set(-35,60,25);sun.castShadow=true;scene.add(sun);

/* WORLD */
const roadMat=new THREE.MeshStandardMaterial({color:0x3c4145,roughness:.96});
const grassMat=new THREE.MeshStandardMaterial({color:0x398944,roughness:1});
const mountainMat=new THREE.MeshStandardMaterial({color:0x61788c,roughness:1});
const whiteMat=new THREE.MeshBasicMaterial({color:0xf5f5f5});
const yellowMat=new THREE.MeshBasicMaterial({color:0xffcf25});

const grass=new THREE.Mesh(new THREE.PlaneGeometry(500,700),grassMat);
grass.rotation.x=-Math.PI/2;grass.position.set(0,-.08,-220);scene.add(grass);

const road=new THREE.Mesh(new THREE.PlaneGeometry(18,700),roadMat);
road.rotation.x=-Math.PI/2;road.position.set(0,0,-220);road.receiveShadow=true;scene.add(road);

for(const x of [-9,9]){
 const e=new THREE.Mesh(new THREE.BoxGeometry(.16,.07,700),yellowMat);
 e.position.set(x,.04,-220);scene.add(e);
}
const wetRoad=new THREE.Mesh(
 new THREE.PlaneGeometry(17.6,700),
 new THREE.MeshStandardMaterial({color:0x50565a,roughness:.42,metalness:.08,transparent:true,opacity:.22})
);
wetRoad.rotation.x=-Math.PI/2;wetRoad.position.set(0,.018,-220);scene.add(wetRoad);

const laneMarks=[];
for(let lane=1;lane<4;lane++)for(let i=0;i<70;i++){
 const m=new THREE.Mesh(new THREE.BoxGeometry(.09,.035,3.3),whiteMat);
 m.position.set(-9+4.5*lane,.06,-i*10);
 scene.add(m);laneMarks.push(m);
}

/* mountains */
for(let i=0;i<10;i++){
 const m=new THREE.Mesh(new THREE.ConeGeometry(16+Math.random()*12,35+Math.random()*28,6),mountainMat);
 m.position.set((i-5)*27,15,-115-Math.random()*25);
 m.scale.x=1.6;m.rotation.y=Math.random();
 scene.add(m);
}

/* city */
const buildings=[];
for(let i=0;i<36;i++)for(const side of [-1,1]){
 const w=4+Math.random()*7,h=8+Math.random()*32,d=5+Math.random()*8;
 const mat=new THREE.MeshStandardMaterial({color:[0x8fa9b9,0x6f8d9e,0xa5b8c2,0x55798e][i%4],roughness:.75,metalness:.08});
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 b.position.set(side*(13+Math.random()*18),h/2,-35-i*13-Math.random()*8);
 b.castShadow=true;b.receiveShadow=true;scene.add(b);buildings.push(b);
}

/* palms + trees */
const foliage=new THREE.MeshStandardMaterial({color:0x218342,roughness:1});
const trunkMat=new THREE.MeshStandardMaterial({color:0x69442b,roughness:1});
const trees=[];
function addPalm(x,z,s=1){
 const g=new THREE.Group();g.position.set(x,0,z);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,3.6*s,8),trunkMat);trunk.position.y=1.8*s;g.add(trunk);
 for(let k=0;k<7;k++){
  const leaf=new THREE.Mesh(new THREE.ConeGeometry(.16,2.4*s,5),foliage);
  leaf.position.y=3.6*s;leaf.rotation.z=Math.PI/2;leaf.rotation.y=k*Math.PI*2/7;g.add(leaf);
 }
 scene.add(g);trees.push(g);
}
for(let i=0;i<50;i++)addPalm((Math.random()<.5?-1:1)*(11+Math.random()*8),-i*14-12,.75+Math.random()*.45);

/* highway lights */
for(let i=0;i<28;i++){
 const z=-25-i*22;
 for(const x of [-8.1,8.1]){
   const pole=new THREE.Mesh(new THREE.CylinderGeometry(.055,.07,5.4,10),material(0x69747b,.7,.22));
   pole.position.set(x,2.7,z);scene.add(pole);
   const arm=new THREE.Mesh(new THREE.BoxGeometry(1.2,.06,.06),material(0x69747b,.7,.22));
   arm.position.set(x+(x<0?.55:-.55),5.25,z);scene.add(arm);
   const lamp=new THREE.Mesh(new THREE.BoxGeometry(.34,.07,.18),new THREE.MeshBasicMaterial({color:0xfff3d0}));
   lamp.position.set(x+(x<0?1.05:-1.05),5.18,z);scene.add(lamp);
 }
}

/* signs */
function sign(text,x,z){
 const board=new THREE.Mesh(new THREE.BoxGeometry(4.7,1.15,.12),new THREE.MeshStandardMaterial({color:0x176c52,roughness:.7}));
 board.position.set(x,5,z);scene.add(board);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,5,8),new THREE.MeshStandardMaterial({color:0x666b6e}));
 pole.position.set(x,2.5,z);scene.add(pole);
 // simple white text as canvas texture
 const cv=document.createElement("canvas");cv.width=512;cv.height=128;const c=cv.getContext("2d");
 c.fillStyle="#176c52";c.fillRect(0,0,512,128);c.fillStyle="white";c.font="bold 52px Arial";c.textAlign="center";c.textBaseline="middle";c.fillText(text,256,64);
 const tx=new THREE.CanvasTexture(cv);const sm=new THREE.MeshBasicMaterial({map:tx,transparent:true});
 const face=new THREE.Mesh(new THREE.PlaneGeometry(4.5,1.12),sm);face.position.set(x,5.02,z-.07);scene.add(face);
}
sign("↑ CITY CENTER", -2.8,-55);sign("✈ AIRPORT ↑", 2.8,-55);

/* player car */
function material(c,metal=.2,rough=.3){return new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough})}
function createPlayer(){
 const g=new THREE.Group();
 const blue=material(0x086dff,.72,.16);
 const blue2=material(0x18a0ff,.58,.18);
 const dark=material(0x05080c,.18,.22);
 const carbon=material(0x11151a,.35,.28);
 const glass=material(0x071b2b,.62,.08);
 const chrome=material(0xc7d2dc,.9,.14);
 const red=material(0xff1010,.15,.18);

 // Main low supercar body
 const body=new THREE.Mesh(new THREE.BoxGeometry(2.72,.62,4.82),blue);
 body.userData.paint=1;
 body.position.y=.73;body.castShadow=true;g.add(body);

 const nose=new THREE.Mesh(new THREE.BoxGeometry(2.45,.25,1.18),blue2);
 nose.userData.paint=2;
 nose.position.set(0,1.03,-1.72);nose.castShadow=true;g.add(nose);

 const sideL=new THREE.Mesh(new THREE.BoxGeometry(.22,.42,2.65),blue2);
 sideL.userData.paint=2;
 sideL.position.set(-1.27,.78,-.05);g.add(sideL);
 const sideR=sideL.clone();sideR.position.x=1.27;g.add(sideR);

 // cockpit + windshield
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.76,.68,1.86),glass);
 cabin.position.set(0,1.37,.05);cabin.castShadow=true;g.add(cabin);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(1.55,.10,1.72),carbon);
 roof.position.set(0,1.73,.06);g.add(roof);

 // rear deck and diffuser
 const rearDeck=new THREE.Mesh(new THREE.BoxGeometry(2.48,.22,1.20),blue2);
 rearDeck.userData.paint=2;
 rearDeck.position.set(0,1.02,1.58);g.add(rearDeck);
 const diffuser=new THREE.Mesh(new THREE.BoxGeometry(2.28,.28,.42),carbon);
 diffuser.position.set(0,.38,2.47);g.add(diffuser);

 // Large rear wing
 const wing=new THREE.Mesh(new THREE.BoxGeometry(2.36,.13,.32),carbon);
 wing.position.set(0,1.45,2.03);wing.castShadow=true;g.add(wing);
 for(const x of [-.9,.9]){
   const leg=new THREE.Mesh(new THREE.BoxGeometry(.12,.55,.12),carbon);
   leg.position.set(x,1.18,2.00);g.add(leg);
 }

 // wheels — identical size and placement
 const wheelMat=material(0x07090b,0,.92);
 const rimMat=material(0xb7c3cc,.85,.16);
 for(const x of [-1.38,1.38])for(const z of [-1.52,1.52]){
   const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.28,24),wheelMat);
   w.rotation.z=Math.PI/2;w.position.set(x,.51,z);w.castShadow=true;g.add(w);
   const r=new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.30,20),rimMat);
   r.rotation.z=Math.PI/2;r.position.set(x,.51,z);g.add(r);
 }

 // Rear lights + center brake strip
 for(const x of [-.86,.86]){
   const l=new THREE.Mesh(new THREE.BoxGeometry(.58,.14,.065),new THREE.MeshBasicMaterial({color:0xff1414}));
   l.position.set(x,.84,2.43);g.add(l);
 }
 const brake=new THREE.Mesh(new THREE.BoxGeometry(.72,.055,.045),new THREE.MeshBasicMaterial({color:0xff3030}));
 brake.position.set(0,1.01,2.46);g.add(brake);

 // Headlights
 for(const x of [-.80,.80]){
   const l=new THREE.Mesh(new THREE.BoxGeometry(.50,.12,.065),new THREE.MeshBasicMaterial({color:0xdff9ff}));
   l.position.set(x,.93,-2.44);g.add(l);
 }

 // Exhausts
 for(const x of [-.36,.36]){
   const ex=new THREE.Mesh(new THREE.CylinderGeometry(.10,.10,.18,16),chrome);
   ex.rotation.x=Math.PI/2;ex.position.set(x,.47,2.55);g.add(ex);
 }

 return g;
}
const player=createPlayer();player.position.set(0,0,6.5);scene.add(player);
let selectedCarColor=Number(localStorage.getItem("procarCarColor")||"0x086dff");
if(!Number.isFinite(selectedCarColor))selectedCarColor=0x086dff;
function applyPlayerColor(hex){
  const base=new THREE.Color(hex);
  const light=base.clone();light.offsetHSL(0,0.02,0.16);
  player.traverse(o=>{
    if(!o.isMesh||!o.material||!o.material.color)return;
    if(o.userData.paint===1)o.material.color.copy(base);
    if(o.userData.paint===2)o.material.color.copy(light);
  });
}
applyPlayerColor(selectedCarColor);

/* traffic */
const traffic=[];
const colors=[0xe52f38,0xf2f2f2,0xf1a524,0x257cf5,0x22252b];
function makeTraffic(color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2.30,.68,4.00),material(color,.35,.28));
 body.position.y=.72;body.castShadow=true;g.add(body);
 const cab=new THREE.Mesh(new THREE.BoxGeometry(1.60,.62,1.68),material(0x152737,.42,.16));
 cab.position.set(0,1.25,.02);cab.castShadow=true;g.add(cab);
 const bumper=new THREE.Mesh(new THREE.BoxGeometry(2.05,.26,.24),material(0x111417,.15,.35));
 bumper.position.set(0,.53,2.02);g.add(bumper);
 for(const x of [-1.13,1.13])for(const z of [-1.35,1.35]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.24,20),material(0x090909,0,.9));
  w.rotation.z=Math.PI/2;w.position.set(x,.48,z);g.add(w);
 }
 for(const x of [-.72,.72]){
  const l=new THREE.Mesh(new THREE.BoxGeometry(.38,.11,.05),new THREE.MeshBasicMaterial({color:0xff1b1b}));
  l.position.set(x,.80,2.04);g.add(l);
 }
 return g;
}
function spawnTraffic(z){
 const t=makeTraffic(colors[(Math.random()*colors.length)|0]);
 t.scale.set(1,1,1);
 t.position.set([-6.75,-2.25,2.25,6.75][(Math.random()*4)|0],0,z);
 t.userData.speed=60+Math.random()*85;scene.add(t);traffic.push(t);
}
for(let i=0;i<10;i++)spawnTraffic(-45-i*27);

/* coins */
const coinMat=material(0xffd21a,.75,.18);coinMat.emissive.setHex(0x5c3900);
const coins=[];
function spawnCoin(z){
 const c=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.14,24),coinMat);
 c.rotation.x=Math.PI/2;c.position.set([-6.75,-2.25,2.25,6.75][(Math.random()*4)|0],1.15,z);
 scene.add(c);coins.push(c);
}
for(let i=0;i<14;i++)spawnCoin(-35-i*17);

/* CRASH FX — sparks + camera shake */
const crashSparks=[];
let cameraShake=0;
function createCrashSparks(pos){
  for(let i=0;i<22;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(.055+Math.random()*.045,6,6),new THREE.MeshBasicMaterial({color:Math.random()<.72?0xffd21a:0xff6a00}));
    m.position.copy(pos);
    m.position.x+=(Math.random()-.5)*1.2; m.position.y+=.45+Math.random()*.8; m.position.z+=(Math.random()-.5)*1.0;
    m.userData.v=new THREE.Vector3((Math.random()-.5)*5,1.5+Math.random()*4,(Math.random()-.5)*5);
    m.userData.life=.35+Math.random()*.45; scene.add(m); crashSparks.push(m);
  }
  cameraShake=Math.max(cameraShake,0.42);
}
function updateCrashSparks(dt){
  for(let i=crashSparks.length-1;i>=0;i--){const p=crashSparks[i];p.userData.life-=dt;p.userData.v.y-=10*dt;p.position.addScaledVector(p.userData.v,dt);p.scale.multiplyScalar(.94);if(p.userData.life<=0){scene.remove(p);p.geometry.dispose();p.material.dispose();crashSparks.splice(i,1);}}
  cameraShake=Math.max(0,cameraShake-dt*1.8);
}

/* AUDIO ENGINE — generated locally with WebAudio, no external audio files */
let audioCtx=null, engineOsc=null, engineGain=null, engineFilter=null, audioReady=false;
let lastCoinSound=0,lastCrashSound=0,accidents=0;

function initAudio(){
  if(audioReady)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audioCtx=new AC();
  if(audioCtx.state==="suspended")audioCtx.resume();
  engineOsc=audioCtx.createOscillator();
  engineGain=audioCtx.createGain();
  engineFilter=audioCtx.createBiquadFilter();
  engineOsc.type="sawtooth";
  engineFilter.type="lowpass";
  engineFilter.frequency.value=760;
  engineGain.gain.value=0;
  engineOsc.connect(engineFilter).connect(engineGain).connect(audioCtx.destination);
  engineOsc.start();
  audioReady=true;
}
function engineSound(){
  if(!audioReady||!engineOsc)return;
  const t=audioCtx.currentTime;
  const rpm=80+state.speed*2.8+(input.gas?55:0);
  engineOsc.frequency.setTargetAtTime(rpm,t,.035);
  engineFilter.frequency.setTargetAtTime(650+state.speed*3.0+(input.gas?220:0),t,.06);
  engineGain.gain.setTargetAtTime(state.paused||state.over ? 0 : (input.gas ? .16 : .105),t,.06);
}
function beep(freq,dur,type="sine",vol=.07){
  if(!audioReady)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+dur);
}
function coinSound(){beep(880,.08,"sine",.09);setTimeout(()=>beep(1320,.10,"sine",.07),55)}
function brakeSound(){beep(110,.12,"sawtooth",.055)}
function crashSound(){
  if(!audioReady)return;
  const t=audioCtx.currentTime; const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  o.type="sawtooth";o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(38,t+.32);
  f.type="lowpass";f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(180,t+.32);
  g.gain.setValueAtTime(.26,t);g.gain.exponentialRampToValueAtTime(.001,t+.34);
  o.connect(f).connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.35);
  setTimeout(()=>beep(55,.18,"square",.12),55);
}
function pauseSound(){beep(420,.07,"sine",.05)}

/* state + controls */
const savedBestScore=Number(localStorage.getItem("procarBestScore")||0);
const state={speed:55,distance:2.8,score:1250,coins:48,fuel:100,health:100,paused:false,over:false,started:false,bestScore:savedBestScore};
let countdownRunning=false;
const input={left:false,right:false,gas:false,brake:false};
const bgMusic=document.getElementById("bgMusic");
const musicBtn=document.getElementById("music");
let musicOn=true;
const bestScoreEl=document.getElementById("bestScore");
bestScoreEl.textContent=state.bestScore;
function saveBestScore(){
  if(state.score>state.bestScore){
    state.bestScore=state.score;
    localStorage.setItem("procarBestScore",String(state.bestScore));
  }
  bestScoreEl.textContent=state.bestScore;
}
bgMusic.volume=0.32;
function startMusic(){
  if(!musicOn)return;
  bgMusic.play().catch(()=>{});
}
function stopMusic(){bgMusic.pause();}
musicBtn.addEventListener("pointerdown",ev=>{
  ev.preventDefault(); ev.stopPropagation();
  musicOn=!musicOn;
  if(musicOn){startMusic(); musicBtn.textContent="🎵";}
  else {stopMusic(); musicBtn.textContent="🔇";}
});
document.addEventListener("pointerdown",()=>startMusic(),{once:true});

function bind(id,key){
 initAudio();
 const e=document.getElementById(id);
 const on=v=>ev=>{ev.preventDefault();input[key]=v};
 e.addEventListener("pointerdown",on(true));e.addEventListener("pointerup",on(false));
 e.addEventListener("pointercancel",on(false));e.addEventListener("pointerleave",on(false));
}
bind("left","left");bind("right","right");bind("gas","gas");bind("brake","brake");
const carSelect=document.getElementById("carSelect");
const carChoices=[...document.querySelectorAll(".carChoice")];
carChoices.forEach(btn=>btn.addEventListener("pointerdown",ev=>{
  ev.preventDefault();ev.stopPropagation();
  carChoices.forEach(b=>b.classList.remove("active"));btn.classList.add("active");
  selectedCarColor=parseInt(btn.dataset.color,16);
  applyPlayerColor(selectedCarColor);
  localStorage.setItem("procarCarColor",String(selectedCarColor));
}));
document.getElementById("playNow").addEventListener("pointerdown",ev=>{
  ev.preventDefault();ev.stopPropagation();
  document.getElementById("startScreen").style.display="none";
  carSelect.style.display="flex";
});

function runCountdown(){
  if(countdownRunning)return;
  countdownRunning=true;
  const overlay=document.getElementById("countdown"),num=document.getElementById("countNum");
  overlay.style.display="flex";
  const steps=["3","2","1","GO!"];
  let i=0;
  const tick=()=>{
    num.textContent=steps[i];
    num.style.animation="none";void num.offsetWidth;num.style.animation="countPop .8s ease both";
    if(steps[i]==="GO!"){
      state.started=true;state.paused=false;state.over=false;
      initAudio();startMusic();engineSound();
      setTimeout(()=>{overlay.style.display="none";countdownRunning=false},550);
    }else{setTimeout(()=>{i++;tick()},850)}
  };
  tick();
}

document.getElementById("startGame").addEventListener("pointerdown",ev=>{
  ev.preventDefault();ev.stopPropagation();
  carSelect.style.display="none";
  runCountdown();
});
document.getElementById("pause").onclick=()=>{
 if(!state.started||state.over)return;
 initAudio();pauseSound();
 state.paused=!state.paused;
 document.getElementById("pause").textContent=state.paused?"▶":"Ⅱ";
 // Immediately mute the engine while paused; restore it on resume.
 engineSound();
};
document.getElementById("restart").onclick=()=>location.reload();

function update(dt){
 if(!state.started||state.paused||state.over)return;
 if(input.gas)state.speed+=28*dt;else state.speed-=10*dt;
 if(input.brake){state.speed-=65*dt;if(Math.random()<dt*3)brakeSound();}
 engineSound();
 state.speed=THREE.MathUtils.clamp(state.speed,30,160);
 state.fuel=Math.max(0,state.fuel-(input.gas?1.8:.12)*dt);
 if(state.fuel<=0)state.speed=Math.max(55,state.speed-20*dt);
 const steer=(input.right?1:0)-(input.left?1:0);
 player.position.x=THREE.MathUtils.clamp(player.position.x+steer*7.2*dt,-7.05,7.05);
 player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-steer*.045,.12);
 player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,-steer*.09,.12);

 const move=state.speed*dt*.32;
 state.distance+=state.speed*dt/3600;
 state.score=Math.floor(state.distance*100+state.coins*25);
 saveBestScore();

 for(const m of laneMarks){m.position.z+=move*1.3;if(m.position.z>15)m.position.z-=700}
 for(const b of buildings){b.position.z+=move;if(b.position.z>35)b.position.z-=570}
 for(const t of trees){t.position.z+=move;if(t.position.z>30)t.position.z-=720}

 for(const t of traffic){
   t.position.z+=move*(t.userData.speed/state.speed);
   if(t.position.z>18){t.position.z=-260-Math.random()*100;t.position.x=[-6.75,-2.25,2.25,6.75][(Math.random()*4)|0]}
   if(Math.abs(t.position.x-player.position.x)<1.65&&Math.abs(t.position.z-player.position.z)<3.0){
     state.speed*=.82;
     if(!t.userData.hit){
       t.userData.hit=true;accidents++;
       createCrashSparks(new THREE.Vector3((player.position.x+t.position.x)/2,.85,(player.position.z+t.position.z)/2));
       if(performance.now()-lastCrashSound>450){crashSound();lastCrashSound=performance.now();}
       if(accidents>=3){saveBestScore();state.over=true;state.speed=0;engineSound();document.getElementById("final").textContent=`3 car accidents! Score: ${state.score} • Coins: ${state.coins}`;document.getElementById("over").style.display="flex"}
     }
   }
   if(t.position.z>18)t.userData.hit=false;
 }
 for(const c of coins){
   c.position.z+=move*1.08;c.rotation.z+=dt*5;
   if(c.position.z>18){c.position.z=-260-Math.random()*100;c.position.x=[-6.75,-2.25,2.25,6.75][(Math.random()*4)|0]}
   if(c.visible&&Math.abs(c.position.x-player.position.x)<1.45&&Math.abs(c.position.z-player.position.z)<2.5){
     c.visible=false;state.coins++;coinSound();setTimeout(()=>c.visible=true,7000);
   }
 }
 document.getElementById("speed").textContent=Math.round(state.speed);
 document.getElementById("score").textContent=state.score;
 document.getElementById("distance").textContent=state.distance.toFixed(1)+" KM";
 document.getElementById("coins").textContent=state.coins;
document.getElementById("m10").textContent=Math.min(state.coins,10)+"/10";document.getElementById("m25").textContent=Math.min(state.coins,25)+"/25";document.getElementById("m50").textContent=Math.min(state.coins,50)+"/50";
 document.getElementById("fuelFill").style.width=Math.max(0,state.fuel)+"%";
 document.getElementById("healthFill").style.width=Math.max(0,state.health)+"%";
}

function animate(now){
 const dt=Math.min((now-(animate.last||now))/1000,.04);animate.last=now;
 update(dt);
 updateCrashSparks(dt);
 const shakeX=cameraShake?(Math.random()-.5)*cameraShake*.55:0;
 const shakeY=cameraShake?(Math.random()-.5)*cameraShake*.35:0;
 const shakeZ=cameraShake?(Math.random()-.5)*cameraShake*.25:0;
 camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.28,.08)+shakeX;
 camera.position.y=THREE.MathUtils.lerp(camera.position.y,5.0,.05)+shakeY;
 camera.position.z=THREE.MathUtils.lerp(camera.position.z,13.8,.06)+shakeZ;
 camera.lookAt(player.position.x*.12+shakeX*.25,1.05+shakeY*.15,-45);
 renderer.render(scene,camera);requestAnimationFrame(animate);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById("loading").style.display="none";
const soundHint=document.getElementById("soundHint");
let hintTimer=setTimeout(()=>soundHint.style.display="block",900);
setTimeout(()=>soundHint.style.display="none",3500);
document.addEventListener("pointerdown",()=>{initAudio();soundHint.style.display="none";},{once:true});
requestAnimationFrame(animate);
window.addEventListener("error",(e)=>{
 const l=document.getElementById("loading");
 if(l && l.style.display!=="none"){ l.textContent="PROCAR loading error — please reopen the file"; l.style.color="#ffb3b3"; }
});
</script>
